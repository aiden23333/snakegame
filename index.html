<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="贪食蛇">
    <meta name="theme-color" content="#16213e">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="icon-192.png">
    <title>贪食蛇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #eee;
            position: relative;
        }

        /* Top bar */
        .top-bar {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 8px;
        }

        .score-box {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .score-label {
            font-size: 11px;
            color: #8892b0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .score-value {
            font-size: 28px;
            font-weight: 800;
            color: #64ffda;
            text-shadow: 0 0 20px rgba(100, 255, 218, 0.3);
            line-height: 1;
            margin-top: 2px;
        }

        .high-score-box {
            align-items: flex-end;
        }

        .high-score-value {
            color: #ffb86c;
            text-shadow: 0 0 20px rgba(255, 184, 108, 0.3);
        }

        /* Canvas container */
        .canvas-wrap {
            position: relative;
            width: calc(100vw - 32px);
            max-width: 400px;
            aspect-ratio: 1;
            margin: 8px 0;
            border-radius: 20px;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(100, 255, 218, 0.1),
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 0 40px rgba(0, 0, 0, 0.3);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #0d1117;
        }

        /* Overlays */
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(13, 17, 23, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10;
            transition: opacity 0.3s;
            border-radius: 20px;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-title {
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #64ffda, #ffb86c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .overlay-subtitle {
            font-size: 14px;
            color: #8892b0;
            margin-bottom: 24px;
            text-align: center;
            line-height: 1.6;
            padding: 0 24px;
        }

        .overlay-score {
            font-size: 18px;
            color: #c9d1e9;
            margin-bottom: 24px;
        }

        .overlay-score span {
            color: #64ffda;
            font-weight: 800;
            font-size: 24px;
        }

        .play-btn {
            background: linear-gradient(135deg, #64ffda, #48d1cc);
            color: #0d1117;
            border: none;
            padding: 14px 48px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 8px 30px rgba(100, 255, 218, 0.3);
        }

        .play-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 15px rgba(100, 255, 218, 0.2);
        }

        .play-btn.secondary {
            background: transparent;
            color: #64ffda;
            border: 1px solid rgba(100, 255, 218, 0.5);
            box-shadow: none;
            font-size: 16px;
            padding: 12px 44px;
            margin-top: 10px;
        }

        .play-btn.secondary:active {
            transform: scale(0.95);
            background: rgba(100, 255, 218, 0.1);
        }

        /* Controls hint */
        .controls-hint {
            width: 100%;
            max-width: 420px;
            padding: 12px 20px 20px;
            text-align: center;
        }

        .hint-text {
            font-size: 13px;
            color: #636e8e;
            letter-spacing: 0.5px;
        }

        .hint-icon {
            font-size: 20px;
            margin: 0 6px;
        }

        /* Direction pad for non-touch / optional */
        .dpad {
            display: none;
            gap: 6px;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
        }

        .dpad-row {
            display: flex;
            gap: 6px;
        }

        .dpad-btn {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            border: 1px solid rgba(100, 255, 218, 0.15);
            background: rgba(100, 255, 218, 0.05);
            color: #64ffda;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.1s;
        }

        .dpad-btn:active {
            background: rgba(100, 255, 218, 0.2);
        }

        /* 底部 360° 摇杆（不遮挡主画面，位于画布下方独立区域） */
        .joystick-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 2px;
            padding: 4px 0 16px;
            touch-action: none;
        }

        .joystick {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 45%, rgba(100, 255, 218, 0.12), rgba(100, 255, 218, 0.03));
            border: 1px solid rgba(100, 255, 218, 0.25);
            box-shadow: inset 0 0 26px rgba(0, 0, 0, 0.45);
            touch-action: none;
        }

        /* 中心十字参考线 */
        .joystick::before,
        .joystick::after {
            content: "";
            position: absolute;
            background: rgba(100, 255, 218, 0.12);
        }
        .joystick::before {
            left: 50%; top: 14%; bottom: 14%;
            width: 1px; transform: translateX(-0.5px);
        }
        .joystick::after {
            top: 50%; left: 14%; right: 14%;
            height: 1px; transform: translateY(-0.5px);
        }

        .joystick-knob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 52px;
            height: 52px;
            margin-left: -26px;
            margin-top: -26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #64ffda, #48d1cc);
            box-shadow: 0 6px 18px rgba(100, 255, 218, 0.45);
            will-change: transform;
            transition: transform 0.04s linear;
        }

        @media (hover: none) and (pointer: coarse) {
            .dpad { display: none; }
        }

        @media (hover: hover) and (pointer: fine) {
            .dpad { display: flex; }
            .hint-text { display: none; }
        }

        /* Pause button */
        .pause-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid rgba(100, 255, 218, 0.15);
            background: rgba(100, 255, 218, 0.05);
            color: #64ffda;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Difficulty selector & power-up toggle */
        .select-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 2px;
        }

        .select-label {
            font-size: 12px;
            color: #8892b0;
            letter-spacing: 1px;
        }

        .seg {
            display: flex;
            gap: 8px;
        }

        .seg-btn {
            background: rgba(100, 255, 218, 0.08);
            border: 1px solid rgba(100, 255, 218, 0.15);
            color: #64ffda;
            border-radius: 22px;
            padding: 6px 0;
            width: 76px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.3;
            transition: background 0.15s, color 0.15s;
        }

        .seg-btn small {
            font-size: 10px;
            font-weight: 500;
            color: #636e8e;
        }

        .seg-btn.active {
            background: #64ffda;
            color: #0d1117;
            border-color: #64ffda;
        }

        .seg-btn.active small {
            color: rgba(13, 17, 23, 0.7);
        }

        .toggle-btn {
            background: rgba(100, 255, 218, 0.08);
            border: 1px solid rgba(100, 255, 218, 0.15);
            color: #64ffda;
            border-radius: 22px;
            padding: 6px 22px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .toggle-btn.active {
            background: #64ffda;
            color: #0d1117;
            border-color: #64ffda;
        }

        /* In-game HUD: combo & effect badges */
        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            pointer-events: none;
            z-index: 5;
        }

        .badge {
            font-size: 12px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 12px;
            background: rgba(255, 184, 108, 0.18);
            color: #ffb86c;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="score-box">
            <span class="score-label">得分</span>
            <span class="score-value" id="score">0</span>
        </div>
        <button class="pause-btn" id="pauseBtn" style="visibility:hidden">⏸</button>
        <div class="score-box high-score-box">
            <span class="score-label">最高分</span>
            <span class="score-value high-score-value" id="highScore">0</span>
        </div>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
        <canvas id="game"></canvas>

        <!-- In-game HUD: combo & active effects -->
        <div class="hud" id="hud"></div>

        <!-- Start overlay -->
        <div class="overlay" id="startOverlay">
            <div class="overlay-title">贪食蛇</div>
            <div class="overlay-subtitle">
                滑动屏幕控制方向<br>吃掉食物，不要撞墙或自己
            </div>

            <!-- 难度选择 -->
            <div class="select-group">
                <div class="select-label">难度</div>
                <div class="seg" id="difficultySeg">
                    <button class="seg-btn" data-diff="easy">简单<small>穿墙</small></button>
                    <button class="seg-btn active" data-diff="normal">普通<small>撞墙</small></button>
                    <button class="seg-btn" data-diff="hard">困难<small>障碍</small></button>
                </div>
            </div>

            <!-- 道具模式开关 -->
            <div class="select-group">
                <div class="select-label">道具模式</div>
                <button class="toggle-btn active" id="powerToggle">开</button>
            </div>

            <button class="play-btn" id="startBtn">开始游戏</button>
        </div>

        <!-- Game over overlay -->
        <div class="overlay hidden" id="gameOverOverlay">
            <div class="overlay-title" style="background:linear-gradient(135deg,#ff6b6b,#ffb86c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">游戏结束</div>
            <div class="overlay-score">得分 <span id="finalScore">0</span></div>
            <button class="play-btn" id="restartBtn">再来一局</button>
            <button class="play-btn secondary" id="modeBtn">选择模式</button>
        </div>

        <!-- Pause overlay -->
        <div class="overlay hidden" id="pauseOverlay">
            <div class="overlay-title">已暂停</div>
            <button class="play-btn" id="resumeBtn">继续</button>
        </div>
    </div>

    <div class="joystick-zone">
        <div class="joystick" id="joystick">
            <div class="joystick-knob" id="joystickKnob"></div>
        </div>
        <p class="hint-text">拖动摇杆 360° 控制方向 · 也可滑动屏幕</p>
    </div>

<script>
(function() {
    'use strict';

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Grid config
    const GRID_SIZE = 17; // 17x17 grid
    let cellSize = 0;

    // Game state
    let snake = [];
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let food = { x: 0, y: 0 };
    let score = 0;
    let highScore = 0; // 当前模式最高分，真实取值在下方按模式计算
    let gameRunning = false;
    let gamePaused = false;
    let gameOver = false;
    let lastTickTime = 0;
    let tickInterval = 130; // ms per move, decreases as score grows
    let animationId = null;

    // Colors
    const COLORS = {
        bg: '#0d1117',
        gridLine: 'rgba(100, 255, 218, 0.03)',
        snakeHead: '#64ffda',
        snakeBody: '#48d1cc',
        snakeBodyDark: '#2a9d8f',
        food: '#ff6b6b',
        foodGlow: 'rgba(255, 107, 107, 0.3)',
    };

    // 道具类型定义
    const POWERUPS = {
        gold:   { emoji: '🍎', color: '#ffd700' },
        fire:   { emoji: '🔥', color: '#ff6b35' },
        turtle: { emoji: '🐢', color: '#4ade80' },
        ghost:  { emoji: '👻', color: '#a78bfa' },
    };
    const POWERUP_KEYS = Object.keys(POWERUPS);

    // 新增状态：难度 / 道具模式 / 连击 / 障碍 / 道具 / 粒子 / 效果
    let difficulty = 'normal';          // 'easy' 穿墙 | 'normal' 撞墙 | 'hard' 障碍
    let powerUpMode = true;             // 是否开启道具
    let combo = 0;
    const COMBO_WINDOW = 2500;          // 连击有效窗口(ms)
    let lastEatTime = 0;
    let obstacles = [];
    let powerUp = null;                 // { type, x, y }
    let particles = [];
    let speedBoostUntil = 0;
    let slowUntil = 0;
    let ghostUntil = 0;
    let speedState = 'normal';          // 'normal' | 'fast' | 'slow'
    let ghostActive = false;
    let prevSnake = [];            // 上一 tick 蛇的位置（平滑插值用）

    // 各模式最高分：按「难度 + 是否道具」分别记录，从 localStorage 读取
    let bestScores = JSON.parse(localStorage.getItem('snakeBestScores') || '{}');
    function modeKey() { return difficulty + '_' + (powerUpMode ? 1 : 0); }
    // 兼容旧版：若没有任何分模式记录、但有旧全局最高分，迁移到当前模式
    if (Object.keys(bestScores).length === 0) {
        const legacy = parseInt(localStorage.getItem('snakeHighScore') || '0');
        if (legacy > 0) bestScores[modeKey()] = legacy;
    }
    highScore = bestScores[modeKey()] || 0;
    function refreshHighScore() {
        highScore = bestScores[modeKey()] || 0;
        highScoreEl.textContent = highScore;
    }
    function saveBestScores() {
        localStorage.setItem('snakeBestScores', JSON.stringify(bestScores));
    }
    // 更新分数：若超过本模式记录则分别保存
    function updateBestIfNeeded() {
        const k = modeKey();
        if (score > (bestScores[k] || 0)) {
            bestScores[k] = score;
            highScore = score;
            highScoreEl.textContent = highScore;
            saveBestScores();
        }
    }

    // DOM elements
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const finalScoreEl = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const modeBtn = document.getElementById('modeBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const resumeBtn = document.getElementById('resumeBtn');
    const canvasWrap = document.getElementById('canvasWrap');
    const hudEl = document.getElementById('hud');
    const difficultySeg = document.getElementById('difficultySeg');
    const powerToggle = document.getElementById('powerToggle');

    highScoreEl.textContent = highScore;

    // ---- Canvas sizing ----
    function resizeCanvas() {
        const rect = canvasWrap.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cellSize = rect.width / GRID_SIZE;
        draw();
    }

    window.addEventListener('resize', resizeCanvas);

    // ---- Game init ----
    function initGame() {
        const mid = Math.floor(GRID_SIZE / 2);
        snake = [
            { x: mid - 1, y: mid },
            { x: mid - 2, y: mid },
            { x: mid - 3, y: mid },
        ];
        prevSnake = snake.map(s => ({ x: s.x, y: s.y }));
        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        score = 0;
        tickInterval = 130;
        gameOver = false;
        gamePaused = false;
        // 重置新状态
        combo = 0;
        lastEatTime = 0;
        powerUp = null;
        particles = [];
        speedBoostUntil = 0;
        slowUntil = 0;
        ghostUntil = 0;
        speedState = 'normal';
        ghostActive = false;
        obstacles = (difficulty === 'hard') ? generateObstacles() : [];
        placeFood();
        updateScore();
        updateHud();
    }

    function placeFood() {
        let valid = false;
        while (!valid) {
            food.x = Math.floor(Math.random() * GRID_SIZE);
            food.y = Math.floor(Math.random() * GRID_SIZE);
            valid = !snake.some(s => s.x === food.x && s.y === food.y)
                 && !obstacles.some(o => o.x === food.x && o.y === food.y)
                 && !(powerUp && powerUp.x === food.x && powerUp.y === food.y);
        }
    }

    function updateScore() {
        scoreEl.textContent = score;
        updateBestIfNeeded();
    }

    // ---- Game loop ----
    function gameLoop(timestamp) {
        if (!gameRunning) return;
        if (gamePaused || gameOver) {
            lastTickTime = timestamp;
            animationId = requestAnimationFrame(gameLoop);
            return;
        }

        const interval = effectiveInterval();
        if (timestamp - lastTickTime >= interval) {
            tick();
            lastTickTime = timestamp;
        }

        updateParticles(timestamp);
        updateHud();
        draw();
        animationId = requestAnimationFrame(gameLoop);
    }

    // 依据基础速度与加速/减速效果计算实际间隔
    function effectiveInterval() {
        let i = tickInterval;
        const now = performance.now();
        if (now < speedBoostUntil) i *= 0.6;
        if (now < slowUntil) i *= 1.5;
        return Math.max(50, i);
    }

    function tick() {
        const now = performance.now();

        // 效果到期处理
        if (now >= speedBoostUntil && speedState === 'fast') speedState = 'normal';
        if (now >= slowUntil && speedState === 'slow') speedState = 'normal';
        if (now >= ghostUntil) ghostActive = false;

        // 连击窗口过期则清零
        if (combo > 0 && now - lastEatTime > COMBO_WINDOW) combo = 0;

        direction = { ...nextDirection };

        const head = snake[0];
        let newHead = {
            x: head.x + direction.x,
            y: head.y + direction.y,
        };

        // 墙壁：简单模式穿墙，其余模式撞墙即死
        if (difficulty === 'easy') {
            if (newHead.x < 0) newHead.x = GRID_SIZE - 1;
            else if (newHead.x >= GRID_SIZE) newHead.x = 0;
            if (newHead.y < 0) newHead.y = GRID_SIZE - 1;
            else if (newHead.y >= GRID_SIZE) newHead.y = 0;
        } else {
            if (newHead.x < 0 || newHead.x >= GRID_SIZE ||
                newHead.y < 0 || newHead.y >= GRID_SIZE) {
                endGame();
                return;
            }
        }

        // 障碍（困难模式）：撞到即死（幽灵也不能穿越）
        if (obstacles.some(o => o.x === newHead.x && o.y === newHead.y)) {
            endGame();
            return;
        }

        // 撞自己（幽灵生效时忽略）
        if (!ghostActive) {
            if (snake.some(s => s.x === newHead.x && s.y === newHead.y)) {
                endGame();
                return;
            }
        }

        prevSnake = snake.map(s => ({ x: s.x, y: s.y }));
        snake.unshift(newHead);

        // 吃到道具
        if (powerUp && powerUp.x === newHead.x && powerUp.y === newHead.y) {
            applyPowerUp(powerUp.type, newHead);
            powerUp = null;
            snake.pop();
            return;
        }

        // 吃食物
        if (newHead.x === food.x && newHead.y === food.y) {
            // 连击：窗口内连续吃累计
            if (lastEatTime > 0 && now - lastEatTime <= COMBO_WINDOW) combo += 1;
            else combo = 1;
            lastEatTime = now;

            score += 10 * combo;
            updateScore();
            spawnParticles(newHead.x, newHead.y, '#64ffda', 6);
            // 加速：最低 65ms
            tickInterval = Math.max(65, tickInterval - 2.5);
            placeFood();

            // 道具模式下，按概率刷新一个道具
            if (powerUpMode && !powerUp && snake.length < GRID_SIZE * GRID_SIZE - 6) {
                if (Math.random() < 0.28) spawnPowerUp();
            }
        } else {
            snake.pop();
        }
    }

    function endGame() {
        gameOver = true;
        gameRunning = false;
        finalScoreEl.textContent = score;
        gameOverOverlay.classList.remove('hidden');
        pauseBtn.style.visibility = 'hidden';
    }

    // ---- Power-ups & particles ----

    function spawnPowerUp() {
        let pos, tries = 0;
        do {
            pos = {
                x: Math.floor(Math.random() * GRID_SIZE),
                y: Math.floor(Math.random() * GRID_SIZE),
            };
            tries++;
        } while (
            (snake.some(s => s.x === pos.x && s.y === pos.y) ||
             (pos.x === food.x && pos.y === food.y) ||
             obstacles.some(o => o.x === pos.x && o.y === pos.y)) &&
            tries < 100
        );
        const type = POWERUP_KEYS[Math.floor(Math.random() * POWERUP_KEYS.length)];
        powerUp = { type, x: pos.x, y: pos.y };
    }

    function applyPowerUp(type, point) {
        const now = performance.now();
        const cfg = POWERUPS[type];
        if (type === 'gold') {
            score += 50;
            updateScore();
            spawnParticles(point.x, point.y, cfg.color, 12);
        } else if (type === 'fire') {
            speedBoostUntil = now + 4000;
            speedState = 'fast';
            spawnParticles(snake[0].x, snake[0].y, cfg.color, 8);
        } else if (type === 'turtle') {
            slowUntil = now + 4000;
            speedState = 'slow';
            spawnParticles(snake[0].x, snake[0].y, cfg.color, 8);
        } else if (type === 'ghost') {
            ghostUntil = now + 4000;
            ghostActive = true;
            spawnParticles(snake[0].x, snake[0].y, cfg.color, 8);
        }
    }

    function generateObstacles() {
        const mid = Math.floor(GRID_SIZE / 2);
        const result = [];
        let tries = 0;
        while (result.length < 8 && tries < 300) {
            tries++;
            const p = {
                x: 1 + Math.floor(Math.random() * (GRID_SIZE - 2)),
                y: 1 + Math.floor(Math.random() * (GRID_SIZE - 2)),
            };
            // 保留中心 5×5 安全区，避免一出生就被堵
            if (Math.abs(p.x - mid) <= 2 && Math.abs(p.y - mid) <= 2) continue;
            if (result.some(o => o.x === p.x && o.y === p.y)) continue;
            result.push(p);
        }
        return result;
    }

    function spawnParticles(cx, cy, color, count) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 0.02 + Math.random() * 0.06;
            particles.push({
                x: cx + 0.5, y: cy + 0.5,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 1,
                decay: 1.6 + Math.random(),
                color,
                size: 0.08 + Math.random() * 0.08,
            });
        }
        if (particles.length > 140) particles.splice(0, particles.length - 140);
    }

    function updateParticles(timestamp) {
        const dt = 16; // 近似每帧
        for (const p of particles) {
            p.x += p.vx * (dt / 130);
            p.y += p.vy * (dt / 130);
            p.life -= p.decay * (dt / 1000);
        }
        particles = particles.filter(p => p.life > 0);
    }

    function updateHud() {
        if (!gameRunning || gameOver) { hudEl.innerHTML = ''; return; }
        let html = '';
        if (combo >= 2) html += `<span class="badge" style="background:rgba(255,184,108,0.18);color:#ffb86c">连击 x${combo}</span>`;
        if (speedState === 'fast') html += `<span class="badge" style="background:rgba(255,107,53,0.18);color:#ff6b35">🔥 加速</span>`;
        if (speedState === 'slow') html += `<span class="badge" style="background:rgba(74,222,128,0.18);color:#4ade80">🐢 减速</span>`;
        if (ghostActive) html += `<span class="badge" style="background:rgba(167,139,250,0.18);color:#a78bfa">👻 幽灵</span>`;
        hudEl.innerHTML = html;
    }

    // ---- Rendering ----
    function draw() {
        const w = canvas.width / (window.devicePixelRatio || 1);
        const h = canvas.height / (window.devicePixelRatio || 1);

        // Background
        ctx.fillStyle = COLORS.bg;
        ctx.fillRect(0, 0, w, h);

        // Grid lines
        ctx.strokeStyle = COLORS.gridLine;
        ctx.lineWidth = 0.5;
        for (let i = 0; i <= GRID_SIZE; i++) {
            ctx.beginPath();
            ctx.moveTo(i * cellSize, 0);
            ctx.lineTo(i * cellSize, h);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i * cellSize);
            ctx.lineTo(w, i * cellSize);
            ctx.stroke();
        }

        // 障碍（困难模式）
        for (const o of obstacles) {
            const ox = o.x * cellSize + cellSize * 0.06;
            const oy = o.y * cellSize + cellSize * 0.06;
            roundRect(ctx, ox, oy, cellSize * 0.88, cellSize * 0.88, cellSize * 0.2);
            ctx.fillStyle = '#2b2f44';
            ctx.fill();
        }

        // 道具
        if (powerUp) {
            const cx = powerUp.x * cellSize + cellSize / 2;
            const cy = powerUp.y * cellSize + cellSize / 2;
            const cfg = POWERUPS[powerUp.type];
            const pglow = ctx.createRadialGradient(cx, cy, 0, cx, cy, cellSize * 1.2);
            pglow.addColorStop(0, hexToRgba(cfg.color, 0.35));
            pglow.addColorStop(1, hexToRgba(cfg.color, 0));
            ctx.fillStyle = pglow;
            ctx.fillRect(cx - cellSize * 1.2, cy - cellSize * 1.2, cellSize * 2.4, cellSize * 2.4);
            ctx.fillStyle = cfg.color;
            ctx.beginPath();
            ctx.arc(cx, cy, cellSize * 0.36, 0, Math.PI * 2);
            ctx.fill();
            ctx.font = (cellSize * 0.5) + 'px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(cfg.emoji, cx, cy + cellSize * 0.02);
        }

        // Food (pulsing glow)
        const pulse = Math.sin(Date.now() / 200) * 0.15 + 0.85;
        const fx = food.x * cellSize + cellSize / 2;
        const fy = food.y * cellSize + cellSize / 2;
        const fr = cellSize * 0.35 * pulse;

        // Food glow
        const glow = ctx.createRadialGradient(fx, fy, 0, fx, fy, cellSize * 1.2);
        glow.addColorStop(0, COLORS.foodGlow);
        glow.addColorStop(1, 'rgba(255, 107, 107, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(fx - cellSize * 1.2, fy - cellSize * 1.2, cellSize * 2.4, cellSize * 2.4);

        // Food circle
        ctx.fillStyle = COLORS.food;
        ctx.beginPath();
        ctx.arc(fx, fy, fr, 0, Math.PI * 2);
        ctx.fill();

        // Snake（平滑插值：两次 tick 之间滑动，不再一格一顿）
        const moveT = (gameRunning && !gamePaused && !gameOver)
            ? Math.min(1, Math.max(0, (performance.now() - lastTickTime) / effectiveInterval()))
            : 1;
        const ix = [], iy = [];
        for (let i = 0; i < snake.length; i++) {
            const cur = snake[i];
            const prev = (i < prevSnake.length) ? prevSnake[i] : cur;
            let dx = cur.x - prev.x;
            let dy = cur.y - prev.y;
            if (Math.abs(dx) > 1) dx = 0; // 穿墙瞬间吸附，避免跨屏滑动
            if (Math.abs(dy) > 1) dy = 0;
            ix[i] = (prev.x + dx * moveT) * cellSize;
            iy[i] = (prev.y + dy * moveT) * cellSize;
        }
        const pad = cellSize * 0.08;
        const radius = cellSize * 0.25;
        for (let i = snake.length - 1; i >= 0; i--) {
            const sx = ix[i];
            const sy = iy[i];

            if (i === 0) {
                // Head
                ctx.fillStyle = COLORS.snakeHead;
                roundRect(ctx, sx + pad, sy + pad, cellSize - pad * 2, cellSize - pad * 2, radius);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#0d1117';
                const eyeOffset = cellSize * 0.18;
                const eyeR = cellSize * 0.07;
                const cx = sx + cellSize / 2;
                const cy = sy + cellSize / 2;
                let e1x, e1y, e2x, e2y;
                if (direction.x === 1) {
                    e1x = cx + eyeOffset; e1y = cy - eyeOffset;
                    e2x = cx + eyeOffset; e2y = cy + eyeOffset;
                } else if (direction.x === -1) {
                    e1x = cx - eyeOffset; e1y = cy - eyeOffset;
                    e2x = cx - eyeOffset; e2y = cy + eyeOffset;
                } else if (direction.y === 1) {
                    e1x = cx - eyeOffset; e1y = cy + eyeOffset;
                    e2x = cx + eyeOffset; e2y = cy + eyeOffset;
                } else {
                    e1x = cx - eyeOffset; e1y = cy - eyeOffset;
                    e2x = cx + eyeOffset; e2y = cy - eyeOffset;
                }
                ctx.beginPath();
                ctx.arc(e1x, e1y, eyeR, 0, Math.PI * 2);
                ctx.arc(e2x, e2y, eyeR, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Body - gradient color from head to tail
                const t = i / snake.length;
                ctx.fillStyle = `rgb(${Math.round(72 * t + 42 * (1 - t))}, ${Math.round(157 * t + 209 * (1 - t))}, ${Math.round(143 * t + 204 * (1 - t))})`;
                roundRect(ctx, sx + pad, sy + pad, cellSize - pad * 2, cellSize - pad * 2, radius);
                ctx.fill();
            }
        }

        // 粒子（吃食物 / 触发道具时的小迸溅）
        for (const p of particles) {
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x * cellSize, p.y * cellSize, p.size * cellSize * 0.5, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    function hexToRgba(hex, a) {
        const n = parseInt(hex.slice(1), 16);
        const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
        return `rgba(${r}, ${g}, ${b}, ${a})`;
    }

    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    // ---- Input: Swipe（屏幕任意位置均可滑动转向）----
    let touchStartX = 0, touchStartY = 0;
    // 若触摸起始于摇杆区域，则跳过全局滑动转向，避免双重控制
    let touchInJoystick = false;

    function onTouchStart(e) {
        touchInJoystick = !!(e.target.closest && e.target.closest('.joystick'));
        if (touchInJoystick) return;
        if (!gameRunning || gamePaused || gameOver) return;
        const t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
    }

    function onTouchEnd() {
        touchInJoystick = false;
    }

    function onTouchMove(e) {
        if (touchInJoystick) return;
        if (!gameRunning || gamePaused || gameOver) return;
        const t = e.touches[0];
        const dx = t.clientX - touchStartX;
        const dy = t.clientY - touchStartY;
        const absDx = Math.abs(dx);
        const absDy = Math.abs(dy);

        if (absDx < 20 && absDy < 20) return;

        if (absDx > absDy) {
            // Horizontal
            if (dx > 0) setDirection(1, 0);
            else setDirection(-1, 0);
        } else {
            // Vertical
            if (dy > 0) setDirection(0, 1);
            else setDirection(0, -1);
        }

        // Reset start to allow continuous swipes
        touchStartX = t.clientX;
        touchStartY = t.clientY;
    }

    // 在整屏（document）监听触摸，任意位置滑动都能转向
    document.addEventListener('touchstart', onTouchStart, { passive: true });
    document.addEventListener('touchmove', onTouchMove, { passive: true });
    document.addEventListener('touchend', onTouchEnd, { passive: true });

    // Keyboard
    document.addEventListener('keydown', function(e) {
        if (!gameRunning || gamePaused || gameOver) {
            if (e.key === ' ' || e.key === 'Enter') {
                if (gameOver) restartBtn.click();
                else if (!gameRunning) startBtn.click();
            }
            return;
        }
        switch(e.key) {
            case 'ArrowUp': case 'w': setDirection(0, -1); break;
            case 'ArrowDown': case 's': setDirection(0, 1); break;
            case 'ArrowLeft': case 'a': setDirection(-1, 0); break;
            case 'ArrowRight': case 'd': setDirection(1, 0); break;
            case ' ': togglePause(); break;
        }
    });

    function setDirection(x, y) {
        // Prevent reversing into self
        if (snake.length > 1) {
            if (direction.x === -x && direction.y === -y) return;
        }
        nextDirection = { x, y };
    }

    // ---- 底部 360° 摇杆（拖动旋钮 → 按主轴向映射为上下左右）----
    const joystick = document.getElementById('joystick');
    const joyKnob = document.getElementById('joystickKnob');
    let joyActive = false;
    const JOY_DEAD = 16; // 中心死区半径(px)

    function joyUpdate(clientX, clientY) {
        const rect = joystick.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = clientX - cx;
        let dy = clientY - cy;
        const maxOff = rect.width / 2 - 26; // 旋钮半径 26
        const dist = Math.hypot(dx, dy);
        if (dist > maxOff && dist > 0) {
            dx = dx / dist * maxOff;
            dy = dy / dist * maxOff;
        }
        joyKnob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        // 死区内不改变方向（保持当前方向）
        if (dist < JOY_DEAD) return;
        // 按主轴向映射为 4 方向
        let nx = 0, ny = 0;
        if (Math.abs(dx) >= Math.abs(dy)) {
            nx = dx > 0 ? 1 : -1;
        } else {
            ny = dy > 0 ? 1 : -1;
        }
        if (nx !== 0 || ny !== 0) setDirection(nx, ny);
    }

    function joyEnd() {
        joyActive = false;
        joyKnob.style.transform = 'translate(0px,0px)';
    }

    joystick.addEventListener('pointerdown', function(e) {
        joyActive = true;
        if (joystick.setPointerCapture) {
            try { joystick.setPointerCapture(e.pointerId); } catch (_) {}
        }
        joyUpdate(e.clientX, e.clientY);
        e.preventDefault();
        e.stopPropagation();
    });
    joystick.addEventListener('pointermove', function(e) {
        if (!joyActive) return;
        joyUpdate(e.clientX, e.clientY);
        e.preventDefault();
        e.stopPropagation();
    });
    joystick.addEventListener('pointerup', function(e) {
        joyEnd();
        e.stopPropagation();
    });
    joystick.addEventListener('pointercancel', function() { joyEnd(); });
    // 指针离开（如移到元素外未收到 up）也复位
    joystick.addEventListener('pointerleave', function() { if (joyActive) joyEnd(); });

    // D-pad buttons
    document.querySelectorAll('.dpad-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const dir = this.dataset.dir;
            switch(dir) {
                case 'up': setDirection(0, -1); break;
                case 'down': setDirection(0, 1); break;
                case 'left': setDirection(-1, 0); break;
                case 'right': setDirection(1, 0); break;
            }
        });
    });

    // 难度选择
    difficultySeg.querySelectorAll('.seg-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            difficulty = this.dataset.diff;
            difficultySeg.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            refreshHighScore();
        });
    });

    // 道具模式开关
    powerToggle.addEventListener('click', function() {
        powerUpMode = !powerUpMode;
        powerToggle.classList.toggle('active', powerUpMode);
        powerToggle.textContent = powerUpMode ? '开' : '关';
        refreshHighScore();
    });

    // ---- Game control ----
    function startGame() {
        initGame();
        gameRunning = true;
        gameOver = false;
        gamePaused = false;
        startOverlay.classList.add('hidden');
        gameOverOverlay.classList.add('hidden');
        pauseOverlay.classList.add('hidden');
        pauseBtn.style.visibility = 'visible';
        lastTickTime = performance.now();
        if (animationId) cancelAnimationFrame(animationId);
        animationId = requestAnimationFrame(gameLoop);
    }

    function togglePause() {
        if (!gameRunning || gameOver) return;
        gamePaused = !gamePaused;
        if (gamePaused) {
            pauseOverlay.classList.remove('hidden');
        } else {
            pauseOverlay.classList.add('hidden');
            lastTickTime = performance.now();
        }
    }

    function chooseMode() {
        gameRunning = false;
        gameOver = false;
        gamePaused = false;
        if (animationId) cancelAnimationFrame(animationId);
        gameOverOverlay.classList.add('hidden');
        startOverlay.classList.remove('hidden');
        pauseBtn.style.visibility = 'hidden';
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
    modeBtn.addEventListener('click', chooseMode);
    pauseBtn.addEventListener('click', togglePause);
    resumeBtn.addEventListener('click', togglePause);

    // ---- Init ----
    initGame();
    resizeCanvas();
    draw();

    // ---- Test / Debug hook（只读，不影响玩法，供自动化测试读取内部状态）----
    window.__snake = {
        get state() {
            return {
                score,
                highScore,
                bestScores: { ...bestScores },
                mode: modeKey(),
                gameState: gameOver ? 'gameOver' : (gameRunning ? (gamePaused ? 'paused' : 'playing') : 'ready'),
                direction: { ...direction },
                snake: snake.map(s => ({ x: s.x, y: s.y })),
                food: { x: food.x, y: food.y },
                gridSize: GRID_SIZE,
            };
        }
    };

    // ---- Register service worker (PWA: offline + installable) ----
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        });
    }
})();
</script>
</body>
</html>
